<!DOCTYPE html>
<html lang="es" class="w-full h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hacemos las mejores donas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
            background-color: #0b1329;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        .desktop-stage {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #091122 0%, #0f172a 50%, #0284c7 100%);
            position: relative;
            overflow: hidden;
        }

        /* Animated glowing background orbs for PC view */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.45;
            animation: floatOrb 12s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .orb-1 {
            width: 450px;
            height: 450px;
            background: #0084FF;
            top: -10%;
            left: -10%;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #0284c7;
            bottom: -15%;
            right: -10%;
            animation-delay: -6s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, 40px) scale(1.1); }
            100% { transform: translate(-40px, 80px) scale(0.95); }
        }

        .phone-canvas {
            width: 390px;
            height: 844px;
            background-color: #FFFFFF;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            flex-shrink: 0;
            z-index: 10;
        }

        @media (min-width: 640px) {
            .phone-canvas {
                border-radius: 50px;
                box-shadow: 
                    0 0 0 12px #1e293b,
                    0 0 0 14px #334155,
                    0 30px 70px rgba(0, 0, 0, 0.65);
                transform-origin: center center;
            }
        }

        @media (max-width: 639px) {
            .desktop-stage {
                background: #FFFFFF;
            }
            .phone-canvas {
                width: 100vw;
                height: 100dvh;
                border-radius: 0;
                box-shadow: none;
            }
            .bg-orb {
                display: none;
            }
        }

        .btn-primary {
            background-color: #0084FF;
            transition: transform 0.12s ease, background-color 0.15s ease;
        }
        .btn-primary:active {
            background-color: #0072DC;
            transform: scale(0.98);
        }

        .donut-card-img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            object-position: center;
            border-radius: 30px;
        }
    </style>
</head>
<body>

    <div class="desktop-stage" id="stage">
        
        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>

        <!-- PHONE CANVAS FRAME -->
        <div class="phone-canvas px-6 pt-3 pb-2" id="phoneCanvas">

            <!-- 1. TOP STATUS BAR & DYNAMIC ISLAND -->
            <div class="w-full shrink-0 flex items-center justify-between pt-1 relative z-30 h-10">
                <span id="liveClock" class="text-[15px] font-bold text-black pl-3 tracking-tight">--:--</span>

                <div class="w-[120px] h-[32px] bg-black rounded-full absolute left-1/2 -translate-x-1/2 top-1 pointer-events-none"></div>

                <div class="flex items-center space-x-1.5 pr-2">
                    <svg class="w-4 h-3.5 fill-black" viewBox="0 0 18 12">
                        <rect x="0" y="8" width="2.5" height="4" rx="0.5" />
                        <rect x="4" y="6" width="2.5" height="6" rx="0.5" />
                        <rect x="8" y="3.5" width="2.5" height="8.5" rx="0.5" />
                        <rect x="12" y="0.5" width="2.5" height="11.5" rx="0.5" />
                    </svg>

                    <svg class="w-4 h-3.5 fill-black" viewBox="0 0 16 12">
                        <path d="M8 11.5a1.25 1.25 0 100-2.5 1.25 1.25 0 000 2.5z" />
                        <path d="M4.93 7.36a4.34 4.34 0 016.14 0 .75.75 0 001.06-1.06 5.84 5.84 0 00-8.26 0 .75.75 0 001.06 1.06z" />
                        <path d="M2.46 4.89a7.84 7.84 0 0111.08 0 .75.75 0 001.06-1.06 9.34 9.34 0 00-13.2 0 .75.75 0 101.06 1.06z" />
                    </svg>

                    <svg class="w-6 h-3.5 fill-black" viewBox="0 0 24 12">
                        <rect x="0.75" y="0.75" width="19" height="10.5" rx="3.25" fill="none" stroke="#000" stroke-width="1.5"/>
                        <rect x="2.5" y="2.5" width="12" height="7" rx="1.5" fill="#000"/>
                        <path d="M21 4v4a1.5 1.5 0 001.5-1.5v-1A1.5 1.5 0 0021 4z" fill="#000"/>
                    </svg>
                </div>
            </div>

            <!-- 2. DONUT BOX IMAGE CARD -->
            <div class="w-full shrink-0 pt-2 pb-1">
                <img id="donutImg"
                     src="images (2).jpeg" 
                     alt="Caja de Donas Variadas con Manos" 
                     class="donut-card-img shadow-sm pointer-events-none"
                     onerror="this.src='https://placehold.co/600x650/e07a5f/ffffff?text=Donas+Gourmet'">
            </div>

            <!-- 3. TITLE, SUBTITLE & CAROUSEL DOTS -->
            <div class="w-full shrink-0 flex flex-col items-center text-center px-1 py-1">
                <h1 class="text-[27px] font-extrabold text-black tracking-tight leading-tight mb-2">
                    Hacemos las mejores donas
                </h1>

                <p class="text-[#8E8E93] text-[15px] font-normal leading-snug max-w-[300px] mb-4">
                    No tendrás que esperar mucho, ¡el manjar ya está en camino!
                </p>

                <div class="flex items-center justify-center space-x-[7px]">
                    <div id="dot0" class="h-[5px] w-[22px] rounded-full bg-[#0084FF] transition-all duration-300"></div>
                    <div id="dot1" class="h-[5px] w-[5px] rounded-full bg-[#D1D1D6] transition-all duration-300"></div>
                    <div id="dot2" class="h-[5px] w-[5px] rounded-full bg-[#D1D1D6] transition-all duration-300"></div>
                    <div id="dot3" class="h-[5px] w-[5px] rounded-full bg-[#D1D1D6] transition-all duration-300"></div>
                </div>
            </div>

            <!-- 4. ACTION BUTTONS -->
            <div class="w-full shrink-0 flex flex-col items-center space-y-2 pt-1">
                <button onclick="onLogin()" class="w-full py-[16px] btn-primary text-white font-semibold text-[17px] rounded-full tracking-tight text-center cursor-pointer shadow-sm">
                    Log in
                </button>

                <button onclick="onSkip()" class="text-[#8E8E93] text-[15px] font-normal py-1 px-4 cursor-pointer hover:text-black transition-colors">
                    Omitir
                </button>
            </div>

            <!-- 5. FOOTER & HOME INDICATOR -->
            <div class="w-full shrink-0 flex flex-col items-center justify-end pb-1 pt-2">
                <button onclick="onDelete()" class="text-[#A0A0A5] text-[13px] font-normal tracking-tight hover:text-slate-600 transition-colors bg-transparent border-0 cursor-pointer mb-2">
                    borrar la cuenta (Recomendado)
                </button>

                <div class="w-[134px] h-[5px] bg-black rounded-full"></div>
            </div>

        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 bg-slate-900/95 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50">
        <span id="toastMsg">Acción ejecutada</span>
    </div>

    <script>
        // Synchronize live clock with WorldTimeAPI + System clock backup
        async function initLiveClock() {
            const clockEl = document.getElementById('liveClock');

            function setFormattedTime(dateObj) {
                const hours = String(dateObj.getHours()).padStart(2, '0');
                const minutes = String(dateObj.getMinutes()).padStart(2, '0');
                clockEl.textContent = `${hours}:${minutes}`;
            }

            try {
                const response = await fetch('https://worldtimeapi.org/api/ip');
                if (response.ok) {
                    const data = await response.json();
                    const apiDate = new Date(data.datetime);
                    setFormattedTime(apiDate);
                } else {
                    setFormattedTime(new Date());
                }
            } catch (err) {
                setFormattedTime(new Date());
            }

            setInterval(() => {
                setFormattedTime(new Date());
            }, 1000);
        }

        // Auto-scale phone canvas frame in desktop screens without distorting proportions
        function autoScalePhoneFrame() {
            if (window.innerWidth >= 640) {
                const phone = document.getElementById('phoneCanvas');
                const frameHeight = 844 + 40;
                const windowHeight = window.innerHeight;

                if (windowHeight < frameHeight) {
                    const scale = windowHeight / frameHeight;
                    phone.style.transform = `scale(${scale * 0.95})`;
                } else {
                    phone.style.transform = `scale(1)`;
                }
            } else {
                const phone = document.getElementById('phoneCanvas');
                phone.style.transform = `none`;
            }
        }

        window.addEventListener('resize', autoScalePhoneFrame);
        window.addEventListener('DOMContentLoaded', () => {
            autoScalePhoneFrame();
            initLiveClock();
        });

        // Carousel dots navigation
        let activeIndex = 0;
        const totalDots = 4;

        function updateCarouselDots(index) {
            for (let i = 0; i < totalDots; i++) {
                const dot = document.getElementById(`dot${i}`);
                if (i === index) {
                    dot.className = "h-[5px] w-[22px] rounded-full bg-[#0084FF] transition-all duration-300";
                } else {
                    dot.className = "h-[5px] w-[5px] rounded-full bg-[#D1D1D6] transition-all duration-300";
                }
            }
        }

        function triggerToast(text) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = text;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2200);
        }

        function onLogin() {
            triggerToast("Iniciando sesión...");
        }

        function onSkip() {
            activeIndex = (activeIndex + 1) % totalDots;
            updateCarouselDots(activeIndex);
            triggerToast(`Diapositiva ${activeIndex + 1} de ${totalDots}`);
        }

        function onDelete() {
            triggerToast("Solicitud enviada para borrar la cuenta");
        }
    </script>
</body>
</html>
